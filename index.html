<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GIRIGIRI">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="指でドラッグして、障害物の隙間をギリギリで抜け続けるゲーム">
  <title>GIRIGIRI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="safe-probe" aria-hidden="true"></div>

  <div id="app">
    <canvas id="game" aria-label="ゲーム画面"></canvas>

    <button id="btn-pause" class="hud-btn hidden" data-ui data-action="pause" aria-label="一時停止">
      <span></span><span></span>
    </button>

    <!-- タイトル -->
    <section id="screen-title" class="screen">
      <div class="title-top">
        <h1 class="logo">GIRI<b>GIRI</b></h1>
        <p class="tagline">ギリギリで、かわせ。</p>
      </div>
      <div class="title-mid">
        <p class="hint pulse">どこでも押して、そのままドラッグ</p>
      </div>
      <div class="title-bottom">
        <div class="stats">
          <div><span>BEST</span><b id="title-best">0</b></div>
          <div><span>COIN</span><b id="title-coins">0</b></div>
        </div>
        <div class="row">
          <button class="btn" data-ui data-action="skins">SKINS</button>
          <button class="btn" data-ui data-action="settings">SETTINGS</button>
        </div>
      </div>
    </section>

    <!-- 結果 -->
    <section id="screen-result" class="screen hidden" data-ui>
      <div class="result-top">
        <p id="result-newbest" class="newbest hidden">NEW BEST</p>
        <p class="label">SCORE</p>
        <p id="result-score" class="score">0</p>
        <p class="sub">BEST <b id="result-best">0</b></p>
      </div>
      <dl class="details">
        <div><dt>TIME</dt><dd id="r-time">0.0s</dd></div>
        <div><dt>NEAR</dt><dd id="r-near">0</dd></div>
        <div><dt>PERFECT</dt><dd id="r-perfect">0</dd></div>
        <div><dt>MAX COMBO</dt><dd id="r-combo">0</dd></div>
      </dl>
      <p class="coins">+<b id="r-coins">0</b> COIN <span id="r-total"></span></p>
      <p id="r-next" class="next"></p>
      <div class="result-bottom">
        <button id="btn-retry" class="btn btn-big" data-ui>RETRY</button>
        <div class="row">
          <button class="btn" data-ui data-action="home">HOME</button>
          <button class="btn" data-ui data-action="skins">SKINS</button>
        </div>
      </div>
    </section>

    <!-- スキン選択 -->
    <section id="screen-skins" class="screen hidden" data-ui>
      <header class="head">
        <h2>SKINS</h2>
        <p class="sub">COIN <b id="skins-coins">0</b></p>
      </header>
      <div id="skin-grid" class="skin-grid"></div>
      <p class="note">コインはプレイで貯まる（スコア25点＝1枚＋PERFECTごとに1枚）</p>
      <div class="foot"><button class="btn" data-ui data-action="back">BACK</button></div>
    </section>

    <!-- 設定 -->
    <section id="screen-settings" class="screen hidden" data-ui>
      <header class="head"><h2>SETTINGS</h2></header>
      <div class="settings">
        <button class="toggle" data-ui data-setting="effects" aria-pressed="true">
          <span>視覚効果<small>画面揺れ・スロー・点滅</small></span><b></b>
        </button>
        <button class="toggle" data-ui data-setting="sound" aria-pressed="true">
          <span>サウンド</span><b></b>
        </button>
        <button class="toggle" data-ui data-setting="vibration" aria-pressed="true">
          <span>振動<small id="vib-note"></small></span><b></b>
        </button>
        <label class="slider">
          <span>操作感度 <b id="sens-value">1.30</b></span>
          <input id="sens" type="range" min="0.6" max="2.2" step="0.05" value="1.3">
        </label>
        <button class="btn btn-ghost" data-ui data-action="reset">データを消去</button>
      </div>
      <div class="foot"><button class="btn" data-ui data-action="back">BACK</button></div>
    </section>

    <!-- 一時停止 -->
    <section id="screen-pause" class="screen hidden">
      <div class="title-mid">
        <h2 class="paused">PAUSED</h2>
        <p class="hint pulse">押してドラッグで再開</p>
      </div>
      <div class="title-bottom">
        <div class="row"><button class="btn" data-ui data-action="home">HOME</button></div>
      </div>
    </section>

    <div id="rotate" class="rotate"><p>縦向きでプレイしてください</p></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
