# main に push されるたびに、数学ファクトリーのテストを実行し、
# 合格したらゲームを gh-pages ブランチに書き出して GitHub Pages で公開する。
name: テストして公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: テスト（ゲームのロジック）
        run: node tests/run.js

      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site/math-factory
          cp -r index.html style.css js _site/
          # 以前の URL（/math-factory/）で開いた人を、新しい URL（サイトのトップ）へ案内する
          cat > _site/math-factory/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>数学ファクトリー</title>
          <meta http-equiv="refresh" content="0; url=../">
          <script>location.replace('../' + location.search + location.hash);</script>
          <style>body{margin:0;padding:2rem 16px;background:#050704;color:#b6ff3b;font-family:monospace}a{color:#e3ffb0}</style>
          </head>
          <body><p>数学ファクトリーは <a href="../">新しい場所</a> に移りました。</p></body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: gh-pages ブランチに公開
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "公開: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
