# main に push されるたびに、テスト（1000人シミュレーション）を実行し、
# 合格したらサイトを gh-pages ブランチに書き出して GitHub Pages で公開する。
name: テストして公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: テスト（統計との一致を確認）
        run: npm test

      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site
          cp -r index.html stats.html about.html 404.html assets data _site/
          touch _site/.nojekyll

      - name: gh-pages ブランチに公開
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "公開: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
